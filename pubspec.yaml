name: currensee
description: "CurrenSee — real-time foreign exchange and financial tracking for ABC Finance Ltd."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.6
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  http: ^1.6.0
  url_launcher: ^6.3.2
  countries_utils: ^2.0.0
  currency_picker: ^2.0.22
  image_picker: ^1.2.3
  country_picker: ^2.0.28
  firebase_messaging: ^16.7.0
  google_fonts: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icons/app_icon_monochrome.png"

# ---------------------------------------------------------------------------
# Native splash  ->  dart run flutter_native_splash:create
# Plain white on purpose: the animated logo splash is drawn by Flutter in
# lib/screens/splash_screen.dart, so the native one must not show a logo.
# ---------------------------------------------------------------------------
flutter_native_splash:
  color: "#FFFFFF"
  fullscreen: true
  android_12:
    color: "#FFFFFF"
    image: assets/brand/splash_blank.png

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/icons/
    - assets/images/
