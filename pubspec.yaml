name: currensee
description: "CurrenSee — real-time foreign exchange and financial tracking for ABC Finance Ltd."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# ---------------------------------------------------------------------------
# Launcher icons  ->  dart run flutter_launcher_icons
# adaptive_icon_background = AppColors.emeraldBg (#064E3B), see BRAND.md
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#064E3B"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icons/app_icon_monochrome.png"

# ---------------------------------------------------------------------------
# Native splash  ->  dart run flutter_native_splash:create
# color = AppColors.emeraldBg (#064E3B), see BRAND.md
# ---------------------------------------------------------------------------
flutter_native_splash:
  color: "#064E3B"
  image: assets/brand/logo_mark.png
  fullscreen: true
  android_12:
    color: "#064E3B"
    image: assets/brand/splash_android12.png

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/icons/